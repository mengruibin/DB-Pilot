# DB-Pilot internal DB migration config
# NOTE: Keep ASCII-only comments -- configparser on Chinese Windows
# uses GBK locale encoding and cannot parse UTF-8 chars.
# sqlalchemy.url is read from settings.DATABASE_URL in env.py,
# the value below is only a placeholder.
[alembic]
script_location = alembic
sqlalchemy.url = placeholder
log_file = alembic.log
log_level = WARN

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --select E,F,I,N,UP,B,SIM --fix
