# DB-Pilot internal SQLite DB migration config
# NOTE: Keep ASCII-only comments -- configparser on Chinese Windows
# uses GBK locale encoding and cannot parse UTF-8 chars.

[alembic]
script_location = alembic
sqlalchemy.url = sqlite+aiosqlite:///./data/db_pilot.db
log_file = alembic.log
log_level = WARN

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --select E,F,I,N,UP,B,SIM --fix
